<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedPulse</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Rajdhani:wght@600;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#ffffff;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    font-family:'Nunito', sans-serif;
  }

  /* ── main logo wrapper ── */
  .logo-wrap {
    display:flex; flex-direction:column;
    align-items:center; gap:0;
    animation: fadeIn 1s ease forwards;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  /* ══ HEX + CHARACTER SECTION ══ */
  .hex-section {
    position:relative;
    width:380px; height:360px;
    display:flex; align-items:center; justify-content:center;
    animation:floatAnim 3.5s ease-in-out infinite;
  }
  @keyframes floatAnim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* hex shape */
  .hex-frame {
    position:relative;
    width:280px; height:260px;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    background:#fff;
    filter:drop-shadow(0 4px 20px rgba(220,30,30,0.25));
    animation:hexPulse 2.5s ease-in-out infinite;
    z-index:2;
    overflow:hidden;
  }
  @keyframes hexPulse {
    0%,100%{filter:drop-shadow(0 4px 20px rgba(220,30,30,0.2))}
    50%    {filter:drop-shadow(0 4px 35px rgba(220,30,30,0.45))}
  }

  /* hex red border */
  .hex-border {
    position:absolute;
    width:292px; height:272px;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    background: linear-gradient(135deg,#e8232a,#c01020);
    z-index:1;
    animation:hexPulse 2.5s ease-in-out infinite;
  }

  /* video inside hex */
  #char-video {
    width:100%; height:100%;
    object-fit:cover;
    object-position:center top;
    display:none;
  }
  #vidLoader {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#f8f0f0;
  }
  #vidLoader circle { animation:spin 0.9s linear infinite; transform-origin:20px 20px; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ECG line inside hex at bottom */
  .hex-ecg {
    position:absolute;
    bottom:22px; left:0; right:0;
    height:28px;
    z-index:3; pointer-events:none;
  }
  .hex-ecg-path {
    stroke-dasharray:300; stroke-dashoffset:300;
    animation:ecgDraw 2s ease-in-out infinite;
  }
  @keyframes ecgDraw {
    0%  {stroke-dashoffset:300;opacity:0}
    15% {opacity:1}
    65% {stroke-dashoffset:0;opacity:1}
    100%{stroke-dashoffset:-300;opacity:0}
  }

  /* red cross badge top-right */
  .cross-badge {
    position:absolute;
    top: 28px; right: 42px;
    width:52px; height:52px;
    background:#e8232a;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:3px solid #fff;
    z-index:10;
    box-shadow:0 2px 12px rgba(232,35,42,0.5);
    animation:badgePulse 2s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%,100%{transform:scale(1);box-shadow:0 2px 12px rgba(232,35,42,0.5)}
    50%    {transform:scale(1.08);box-shadow:0 4px 20px rgba(232,35,42,0.8)}
  }

  /* ── blood drop ── */
  .blood-drop-wrap {
    position:absolute;
    bottom:-55px; left:50%;
    transform:translateX(-50%);
    z-index:5;
    animation:dropBounce 2.5s ease-in-out infinite;
  }
  @keyframes dropBounce {
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%    {transform:translateX(-50%) translateY(-6px)}
  }
  .blood-drop {
    width:80px; height:95px;
    filter:drop-shadow(0 6px 16px rgba(220,30,30,0.45));
  }

  /* ══ TEXT SECTION ══ */
  .text-section {
    display:flex; flex-direction:column;
    align-items:center; gap:4px;
    margin-top:64px;
  }

  /* RedPulse brand */
  .brand {
    display:flex; align-items:baseline; gap:0;
    line-height:1;
  }
  .brand-red {
    font-family:'Nunito',sans-serif;
    font-size:88px; font-weight:900;
    color:#e8232a;
    letter-spacing:-2px;
    text-shadow:2px 2px 0px rgba(220,30,30,0.15);
    position:relative;
    animation:textAppear 1.2s ease forwards;
  }
  .brand-dark {
    font-family:'Nunito',sans-serif;
    font-size:88px; font-weight:900;
    color:#1a1a1a;
    letter-spacing:-2px;
    animation:textAppear 1.4s ease forwards;
  }
  @keyframes textAppear {
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* heartbeat underline */
  .heartbeat-line {
    width:340px; height:36px;
    margin-top:-4px;
    overflow:visible;
  }
  .hb-line-left, .hb-line-right {
    stroke:#e8232a; stroke-width:2; fill:none;
    animation:fadeIn 1.6s ease forwards;
  }
  .hb-pulse {
    stroke:#e8232a; stroke-width:2.5; fill:none;
    stroke-dasharray:120; stroke-dashoffset:120;
    animation:hbDraw 2s ease-in-out infinite 1.5s;
  }
  @keyframes hbDraw {
    0%  {stroke-dashoffset:120;opacity:0}
    20% {opacity:1}
    65% {stroke-dashoffset:0;opacity:1}
    100%{stroke-dashoffset:-120;opacity:0}
  }

  /* subtitle */
  .subtitle {
    font-family:'Rajdhani',sans-serif;
    font-size:17px; font-weight:600;
    color:#444; letter-spacing:0.5px;
    text-align:center; line-height:1.5;
    margin-top:8px;
    animation:fadeIn 1.8s ease forwards;
  }
  .subtitle span { color:#e8232a; font-weight:700; }
</style>
</head>
<body>

<div class="logo-wrap">

  <!-- ── TOP: HEX + CHARACTER ── -->
  <div class="hex-section">

    <!-- red cross badge -->
    <div class="cross-badge">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="white">
        <rect x="11" y="3" width="6" height="22" rx="2"/>
        <rect x="3" y="11" width="22" height="6" rx="2"/>
      </svg>
    </div>

    <!-- hex border -->
    <div class="hex-border"></div>

    <!-- hex with video -->
    <div class="hex-frame">
      <div id="vidLoader">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#e8232a" stroke-width="3" stroke-dasharray="60 40"/>
        </svg>
      </div>
      <video id="char-video" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>

      <!-- ECG line inside hex -->
      <svg class="hex-ecg" viewBox="0 0 280 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline class="hex-ecg-path"
          points="0,14 30,14 38,14 42,3 48,25 53,1 58,24 62,14 90,14 100,14 104,3 110,25 115,1 120,24 124,14 152,14 162,14 166,3 172,25 177,1 182,24 186,14 214,14 224,14 228,3 234,25 239,1 244,24 248,14 280,14"
          stroke="#e8232a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      </svg>
    </div>

    <!-- blood drop hanging below hex -->
    <div class="blood-drop-wrap">
      <svg class="blood-drop" viewBox="0 0 80 95" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- drop body -->
        <path d="M40 4 C40 4 8 38 8 58 C8 76.4 22.4 90 40 90 C57.6 90 72 76.4 72 58 C72 38 40 4 40 4Z"
          fill="url(#dropGrad)" stroke="white" stroke-width="2.5"/>
        <!-- shine -->
        <ellipse cx="30" cy="45" rx="6" ry="10" fill="rgba(255,255,255,0.35)" transform="rotate(-20 30 45)"/>
        <!-- small shine dot -->
        <circle cx="50" cy="65" r="3" fill="rgba(255,255,255,0.25)"/>
        <defs>
          <radialGradient id="dropGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff4455"/>
            <stop offset="60%" stop-color="#e8232a"/>
            <stop offset="100%" stop-color="#8b0000"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

  </div>

  <!-- ── BOTTOM: TEXT ── -->
  <div class="text-section">

    <div class="brand">
      <span class="brand-red">Red</span><span class="brand-dark">Pulse</span>
    </div>

    <!-- heartbeat underline -->
    <svg class="heartbeat-line" viewBox="0 0 340 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line class="hb-line-left"  x1="0"   y1="18" x2="105" y2="18"/>
      <polyline class="hb-pulse"
        points="105,18 115,18 120,5 127,31 132,2 137,30 142,18 152,18 157,5 164,31 169,2 174,30 179,18 189,18 194,5 201,31 206,2 211,30 216,18 226,18"
        stroke="#e8232a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line class="hb-line-right" x1="226" y1="18" x2="340" y2="18"/>
    </svg>

    <div class="subtitle">
      An Intelligent Blood Donation Management System<br>
      Using <span>Predictive Analytics</span> and <span>Geospatial Optimization</span>
    </div>

  </div>
</div>

  const vid    = document.getElementById('char-video');
  const loader = document.getElementById('vidLoader');

  function showVideo() {
    loader.style.display = 'none';
    vid.style.display    = 'block';
  }

  const canWebM = vid.canPlayType('video/webm; codecs="vp9"') !== '';
  vid.src = canWebM ? WEBM : MP4;

  vid.addEventListener('canplay', function onCan() {

    showVideo();

    vid.src = canWebM ? MP4 : WEBM;
    vid.load();
  });
  vid.load();
