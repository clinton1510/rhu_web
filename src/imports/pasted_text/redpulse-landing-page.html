<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedPulse — Blood Donation Management System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap');
  :root {
    --red: #e8232a; --red-dark: #9a0f14; --red-glow: #ff3344;
    --white: #ffffff; --black: #080808;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--black);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Bebas Neue',sans-serif; overflow:hidden;
  }

  /* particles */
  .particles { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .particle {
    position:absolute; border-radius:50%; background:var(--red);
    animation:particleDrift linear infinite; opacity:0;
  }
  @keyframes particleDrift {
    0%  { transform:translateY(100vh); opacity:0; }
    10% { opacity:.55; }
    90% { opacity:.25; }
    100%{ transform:translateY(-120px) translateX(25px); opacity:0; }
  }

  /* ECG BG */
  .ecg-bg {
    position:fixed; bottom:10%; left:0; width:200%; height:60px;
    opacity:.07; animation:ecgScroll 7s linear infinite; z-index:0;
  }
  @keyframes ecgScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* wrapper */
  .logo-wrapper {
    position:relative; display:flex; flex-direction:column;
    align-items:center; gap:18px; z-index:1;
  }

  /* hex container */
  .hex-container {
    position:relative; width:300px; height:300px;
    display:flex; align-items:center; justify-content:center;
    animation:floatAnim 3.5s ease-in-out infinite;
  }
  @keyframes floatAnim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* pulse rings */
  .pulse-ring {
    position:absolute; width:252px; height:252px;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    border:2px solid var(--red); animation:ringExpand 3.2s ease-out infinite; z-index:0;
  }
  .pulse-ring:nth-child(2){animation-delay:1.07s}
  .pulse-ring:nth-child(3){animation-delay:2.14s}
  @keyframes ringExpand { 0%{transform:scale(1);opacity:.9} 100%{transform:scale(1.8);opacity:0} }

  /* spinning rings */
  .hex-ring { position:absolute; width:100%; height:100%; animation:spinSlow 9s linear infinite; }
  .hex-ring svg { width:100%; height:100%; }
  .hex-ring-2 { animation:spinSlow 13s linear infinite reverse; opacity:.35; }
  @keyframes spinSlow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* outer red border hex */
  .hex-border-outer {
    position:absolute; width:248px; height:248px;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:var(--red); z-index:1; animation:borderPulse 2s ease-in-out infinite;
  }
  @keyframes borderPulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* main hex */
  .hex-main {
    position:relative; width:234px; height:234px;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    z-index:2; animation:hexGlow 2s ease-in-out infinite;
  }
  @keyframes hexGlow {
    0%,100%{filter:drop-shadow(0 0 8px var(--red-glow)) drop-shadow(0 0 22px rgba(232,35,42,.45))}
    50%    {filter:drop-shadow(0 0 22px var(--red-glow)) drop-shadow(0 0 50px rgba(232,35,42,.8))}
  }

  /* character fills hex */
  .char-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center top;
  }

  /* scanlines */
  .scanlines {
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
    animation:scanMove 5s linear infinite;
  }
  @keyframes scanMove { from{background-position:0 0} to{background-position:0 120px} }

  /* glitch */
  .glitch-overlay {
    position:absolute; inset:0; background:var(--red); opacity:0;
    z-index:4; mix-blend-mode:screen; animation:glitchFlash 6s steps(1) infinite;
  }
  @keyframes glitchFlash {
    0%,89%,100%{opacity:0} 90%{opacity:.18} 91%{opacity:0} 92%{opacity:.1} 93%{opacity:0}
  }

  /* blood-drop corner badges */
  .drop-badge {
    position:absolute; width:20px; height:24px; z-index:5;
  }
  .drop-badge:nth-child(1){top:2%;left:50%;transform:translateX(-50%);animation:dpTop 2s ease-in-out infinite 0s}
  .drop-badge:nth-child(2){top:50%;right:1%;transform:translateY(-50%);animation:dpSide 2s ease-in-out infinite .4s}
  .drop-badge:nth-child(3){bottom:2%;left:50%;transform:translateX(-50%);animation:dpTop 2s ease-in-out infinite .8s}
  .drop-badge:nth-child(4){top:50%;left:1%;transform:translateY(-50%);animation:dpSide 2s ease-in-out infinite 1.2s}
  @keyframes dpTop {
    0%,100%{opacity:.6;transform:translateX(-50%) scale(.85);filter:drop-shadow(0 0 3px #ff2233)}
    50%    {opacity:1; transform:translateX(-50%) scale(1.2); filter:drop-shadow(0 0 8px #ff2233)}
  }
  @keyframes dpSide {
    0%,100%{opacity:.6;transform:translateY(-50%) scale(.85);filter:drop-shadow(0 0 3px #ff2233)}
    50%    {opacity:1; transform:translateY(-50%) scale(1.2); filter:drop-shadow(0 0 8px #ff2233)}
  }

  /* brand name */
  .name-row { display:flex; align-items:center; gap:10px; }
  .accent-line {
    width:70px; height:2px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    animation:linePulse 2.2s ease-in-out infinite;
  }
  .accent-line-r{animation-delay:.5s}
  @keyframes linePulse { 0%,100%{opacity:.5;transform:scaleX(.8)} 50%{opacity:1;transform:scaleX(1.2)} }

  .brand-name{display:flex;align-items:baseline}
  .brand-red {
    font-family:'Bebas Neue',sans-serif; font-size:58px; letter-spacing:4px;
    color:var(--red); position:relative;
    text-shadow:0 0 14px rgba(232,35,42,.9),0 0 32px rgba(232,35,42,.4);
    animation:textPulse 2s ease-in-out infinite;
  }
  .brand-white {
    font-family:'Bebas Neue',sans-serif; font-size:58px; letter-spacing:4px;
    color:var(--white); text-shadow:0 0 10px rgba(255,255,255,.4);
    animation:textPulse 2s ease-in-out infinite .12s;
  }
  @keyframes textPulse { 0%,100%{opacity:1} 50%{opacity:.82} }

  .brand-red::before,.brand-red::after {
    content:'RED'; position:absolute; top:0; left:0;
    font-family:'Bebas Neue',sans-serif; font-size:58px;
  }
  .brand-red::before{color:#00ffcc;clip-path:inset(30% 0 50% 0);animation:tGlitch 6s steps(1) infinite .1s}
  .brand-red::after {color:#ff00aa;clip-path:inset(60% 0 10% 0);animation:tGlitch 6s steps(1) infinite .2s}
  @keyframes tGlitch {
    0%,88%,100%{opacity:0;transform:none}
    89%{opacity:.5;transform:translateX(-3px)} 90%{opacity:0}
    91%{opacity:.4;transform:translateX(3px)} 92%{opacity:0}
  }

  /* heartbeat ECG */
  .heartbeat-bar{display:flex;align-items:center;margin-top:-6px}
  .ecg-path {
    stroke-dasharray:400; stroke-dashoffset:400;
    animation:ecgDraw 2.6s ease-in-out infinite;
  }
  @keyframes ecgDraw {
    0%  {stroke-dashoffset:400;opacity:0}
    20% {opacity:1}
    70% {stroke-dashoffset:0;opacity:1}
    100%{stroke-dashoffset:-400;opacity:0}
  }

  /* subtitle */
  .subtitle {
    font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:6px;
    color:rgba(255,255,255,.4); text-transform:uppercase;
    animation:tagFade 3s ease-in-out infinite;
  }
  @keyframes tagFade { 0%,100%{opacity:.4} 50%{opacity:.75} }

  /* donation tagline */
  .donation-tag {
    font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700;
    letter-spacing:3px; color:var(--red); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    text-shadow:0 0 10px rgba(232,35,42,.6);
    animation:tagFade 2.5s ease-in-out infinite .5s;
  }
  .donation-tag .sep{color:rgba(255,255,255,.35);font-size:10px}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<!-- ECG background line -->
<svg class="ecg-bg" viewBox="0 0 900 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <polyline points="0,30 60,30 75,30 80,5 88,55 95,10 102,50 108,30 160,30 220,30 235,30 240,5 248,55 255,10 262,50 268,30 320,30 380,30 395,30 400,5 408,55 415,10 422,50 428,30 480,30 540,30 555,30 560,5 568,55 575,10 582,50 588,30 640,30 700,30 715,30 720,5 728,55 735,10 742,50 748,30 800,30 860,30 875,30 880,5 888,55 895,10 900,30"
    fill="none" stroke="#e8232a" stroke-width="2"/>
</svg>

<div class="logo-wrapper">

  <div class="hex-container">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <!-- outer spinning dashed rings -->
    <div class="hex-ring">
      <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="150,12 288,81 288,219 150,288 12,219 12,81"
          stroke="#e8232a" stroke-width="1.5" fill="none" stroke-dasharray="9 4" opacity=".65"/>
        <polygon points="150,22 278,86 278,214 150,278 22,214 22,86"
          stroke="#ff4444" stroke-width=".5" fill="none" opacity=".3"/>
        <circle cx="150" cy="12"  r="3.5" fill="#e8232a"/>
        <circle cx="288" cy="81"  r="3.5" fill="#e8232a"/>
        <circle cx="288" cy="219" r="3.5" fill="#e8232a"/>
        <circle cx="150" cy="288" r="3.5" fill="#e8232a"/>
        <circle cx="12"  cy="219" r="3.5" fill="#e8232a"/>
        <circle cx="12"  cy="81"  r="3.5" fill="#e8232a"/>
      </svg>
    </div>
    <div class="hex-ring hex-ring-2">
      <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="150,6 294,78 294,222 150,294 6,222 6,78"
          stroke="#ff4444" stroke-width="1" fill="none" stroke-dasharray="4 14"/>
      </svg>
    </div>

    <div class="hex-border-outer"></div>

    <!-- character hex -->
    <div class="hex-main">
      <img class="char-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAEGCAYAAADBO+hKAAAACXBIWXMAAAsTAAALEwEAmpwYAAAgAElEQVR4Ae2d629bx5n//xd7kUW2C2xRFEUvFEXRokXRF33RN33RN0VRtCiKoiiKoiiKoijauihaFEVRtCiKoijauihaFEVRtCiKoujatWvXrl27du3atWvX" alt="RedPulse mascot" onerror="this.onerror=null;loadFallback(this)"/>
      <div class="scanlines"></div>
      <div class="glitch-overlay"></div>
    </div>

    <!-- blood-drop badges -->
    <svg class="drop-badge" viewBox="0 0 20 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1Z" fill="#e8232a"/>
      <line x1="10" y1="10" x2="10" y2="18" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
      <line x1="6.5" y1="14" x2="13.5" y2="14" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    </svg>
    <svg class="drop-badge" viewBox="0 0 20 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1Z" fill="#e8232a"/>
      <line x1="10" y1="10" x2="10" y2="18" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
      <line x1="6.5" y1="14" x2="13.5" y2="14" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    </svg>
    <svg class="drop-badge" viewBox="0 0 20 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1Z" fill="#e8232a"/>
      <line x1="10" y1="10" x2="10" y2="18" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
      <line x1="6.5" y1="14" x2="13.5" y2="14" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    </svg>
    <svg class="drop-badge" viewBox="0 0 20 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1Z" fill="#e8232a"/>
      <line x1="10" y1="10" x2="10" y2="18" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
      <line x1="6.5" y1="14" x2="13.5" y2="14" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    </svg>

  </div>

  <!-- brand name -->
  <div class="name-row">
    <div class="accent-line"></div>
    <div class="brand-name">
      <span class="brand-red">RED</span><span class="brand-white">PULSE</span>
    </div>
    <div class="accent-line accent-line-r"></div>
  </div>

  <!-- heartbeat ECG line -->
  <div class="heartbeat-bar">
    <svg width="270" height="32" viewBox="0 0 270 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polyline class="ecg-path"
        points="0,16 35,16 46,16 51,3 58,29 64,1 70,27 74,16 108,16 120,16 125,3 132,29 138,1 144,27 148,16 182,16 194,16 199,3 206,29 212,1 218,27 222,16 256,16 270,16"
        stroke="#e8232a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="subtitle">Blood Donation Management System</div>

  <div class="donation-tag">
    <svg width="12" height="15" viewBox="0 0 12 15" fill="#e8232a"><path d="M6 0C6 0 0 6.5 0 9.5a6 6 0 0 0 12 0C12 6.5 6 0 6 0Z"/></svg>
    Donate <span class="sep">·</span> Save Lives <span class="sep">·</span> Every Drop Counts
    <svg width="12" height="15" viewBox="0 0 12 15" fill="#e8232a"><path d="M6 0C6 0 0 6.5 0 9.5a6 6 0 0 0 12 0C12 6.5 6 0 6 0Z"/></svg>
  </div>

</div>

<script>
  // load real image via canvas-converted dataURL from the original
  function loadFallback(img) {
    // If the embedded stub fails, load via fetch from original path
    fetch('/mnt/user-data/uploads/1774008172982_image.png')
      .then(r=>r.blob()).then(blob=>{
        const url = URL.createObjectURL(blob);
        img.src = url;
      }).catch(()=>{});
  }

  // Actually load the image properly using an object URL approach
  (async function() {
    try {
      const resp = await fetch('/mnt/user-data/uploads/1774008172982_image.png');
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      document.querySelector('.char-img').src = url;
    } catch(e) {}
  })();

  // particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = (Math.random()*100)+'vw';
    p.style.animationDuration = (5+Math.random()*9)+'s';
    p.style.animationDelay   = (Math.random()*9)+'s';
    const sz = (1+Math.random()*3)+'px';
    p.style.width = p.style.height = sz;
    if(Math.random()>.6){p.style.borderRadius='50% 50% 50% 0';p.style.transform='rotate(-45deg)';}
    container.appendChild(p);
  }
</script>
</body>
</html>
